name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    tests:
        name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} dependencies)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The PHP version selects the Symfony major: 8.1 → 6.4, 8.2/8.3 → 7.4, 8.4+ → 8.x
                include:
                    # Symfony 6.4.0: old releases trigger Twig deprecations outside the bundle
                    - php: '8.1'
                      dependencies: lowest
                    - php: '8.1'
                      dependencies: highest
                      phpunit-args: --fail-on-deprecation
                    - php: '8.2'
                      dependencies: highest
                      phpunit-args: --fail-on-deprecation
                    - php: '8.3'
                      dependencies: highest
                      phpunit-args: --fail-on-deprecation
                    - php: '8.4'
                      dependencies: highest
                      phpunit-args: --fail-on-deprecation
                    - php: '8.5'
                      dependencies: highest
                      phpunit-args: --fail-on-deprecation

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - run: composer show 'symfony/*' | grep -E '^symfony/(form|http-kernel|validator) '

            - run: vendor/bin/phpunit ${{ matrix.phpunit-args }}
